# SHORiN 风格的 Powerline：系统/用户 → 目录 → Git → 开发环境 → 时间。
# 静态粉色主题开箱可用，不依赖壁纸生成器；所有命名颜色均在下方定义。
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
command_timeout = 1000
palette = "shorin_style"
format = """
[](fg:identity)\
$os$username\
[](fg:identity bg:folder)\
$directory\
[](fg:folder bg:repository)\
$git_branch$git_status\
[](fg:repository bg:runtime)\
$c$cpp$rust$golang$nodejs$php$java$kotlin$haskell$python\
[](fg:runtime bg:environment)\
$docker_context$conda$pixi\
[](fg:environment bg:clock)\
$time\
[](fg:clock)\
$line_break$character"""

[palettes.shorin_style]
identity = "#feb0d3"
folder = "#f2bb99"
repository = "#fdd9e7"
runtime = "#40373a"
environment = "#e0bdcb"
clock = "#59404b"
ink = "#521d3a"
text = "#eedfe3"
success = "#a6da95"
error = "#f38ba8"
accent = "#ffdbc7"

[os]
disabled = false
format = "[ $symbol]($style)"
style = "fg:ink bg:identity"

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[username]
show_always = true
format = "[ $user ]($style)"
style_user = "fg:ink bg:identity"
style_root = "bold fg:ink bg:identity"

[directory]
format = "[ $path ]($style)"
style = "fg:ink bg:folder"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "
"文档" = "󰈙 "
"下载" = " "
"音乐" = "󰝚 "
"图片" = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "fg:ink bg:repository"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:ink bg:repository"

[c]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[cpp]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[rust]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[golang]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[nodejs]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[php]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[java]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[kotlin]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[haskell]
symbol = ""
format = "[ $symbol( $version) ]($style)"
style = "fg:text bg:runtime"

[python]
symbol = ""
format = "[ $symbol( $version)( $virtualenv) ]($style)"
style = "fg:text bg:runtime"

[docker_context]
symbol = ""
format = "[ $symbol( $context) ]($style)"
style = "fg:ink bg:environment"

[conda]
format = "[ $symbol$environment ]($style)"
style = "fg:ink bg:environment"

[pixi]
format = "[ $symbol( $version)( $environment) ]($style)"
style = "fg:ink bg:environment"

[time]
disabled = false
time_format = "%R"
format = "[  $time ]($style)"
style = "fg:text bg:clock"

[line_break]
disabled = false

[character]
success_symbol = "[](bold fg:success)"
error_symbol = "[](bold fg:error)"
vimcmd_symbol = "[](bold fg:success)"
vimcmd_replace_one_symbol = "[](bold fg:accent)"
vimcmd_replace_symbol = "[](bold fg:accent)"
vimcmd_visual_symbol = "[](bold fg:folder)"
